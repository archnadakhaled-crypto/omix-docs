*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
/* Layout: brand band header, sticky category index, product rows with per-document download chips */
:root{--bg:#f6f7fb;--panel:#ffffff;--ink:#14204a;--muted:#5b6478;--line:#dfe3ee;--navy:#112052;--accent:#e8157e;--chip:#eef1f8;--ok:#1d8a5a;
--display:"Poppins",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1226;--panel:#151c38;--ink:#e8ecf8;--muted:#a3abc4;--line:#2a3358;--navy:#9fb2ff;--accent:#ff5aa8;--chip:#1f2848;--ok:#4fd197;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1226;--panel:#151c38;--ink:#e8ecf8;--muted:#a3abc4;--line:#2a3358;--navy:#9fb2ff;--accent:#ff5aa8;--chip:#1f2848;--ok:#4fd197;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:linear-gradient(90deg,#00aae6,#c81e96 55%,#fa9f1e);color:#fff}
header .wrap{padding-block:28px 22px;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;line-height:1.1;text-wrap:balance}
.brand{display:flex;align-items:center;gap:18px}.logo{width:96px;height:auto;border-radius:16px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);flex:none}@media (max-width:640px){.logo{width:68px}}
.sub{margin:6px 0 0;opacity:.92;max-width:60ch}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums;font-size:13px}
.stats b{display:block;font-family:var(--display);font-size:22px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .wrap{padding-block:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input#q{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:wait}
nav.idx{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex-basis:100%}
nav.idx a{font-size:12px;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px;background:var(--chip);white-space:nowrap}
main .wrap{padding-block:18px 60px;display:grid;gap:26px}
section{display:grid;gap:10px;scroll-margin-top:120px}
.sec-head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:6px}
.sec-head h2{font-family:var(--display);font-size:20px;margin:0;color:var(--navy)}
.sec-head h2 small{font:500 12px var(--body);color:var(--accent);letter-spacing:.08em;text-transform:uppercase;display:block}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.pname{font-weight:600;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{font:500 12px var(--body);background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:5px 10px;cursor:pointer}
.chip span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.chip.done{background:color-mix(in srgb,var(--ok) 18%,var(--chip))}
#status{font-size:13px;color:var(--muted);flex-basis:100%;min-height:1.2em}
.note{font-size:13px;color:var(--muted)}
@media (max-width:640px){.row{grid-template-columns:1fr}.chips{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

const ORDER={"TDS":0,"Method Statement":1,"Submittal":2,"Pack Image":3};
const $=s=>document.querySelector(s);const st=$('#status');
const mb=b=>(b/1048576).toFixed(b<1048576?2:1)+' MB';
async function save(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);st.textContent='Downloaded '+name;return true}
async function fetchBlob(p){const r=await fetch(p);if(!r.ok)throw new Error('missing '+p);return r.blob()}
async function zipSet(name,entries,btn){btn&&(btn.disabled=true);const z=new JSZip();let i=0;
 for(const [path,f] of entries){st.textContent='Preparing '+name+' … '+(++i)+' / '+entries.length;z.file(path,await fetchBlob(f.p))}
 st.textContent='Compressing '+name+' …';const blob=await z.generateAsync({type:'blob',compression:'STORE'});btn&&(btn.disabled=false);return save(name,blob)}
const tot=MAN.reduce((a,g)=>a+g.items.reduce((b,it)=>b+it.files.length,0),0),bytes=MAN.reduce((a,g)=>a+g.items.reduce((b,it)=>b+it.files.reduce((c,f)=>c+f.s,0),0),0);
$('#stats').innerHTML=`<div><b>${MAN.slice(0,-1).reduce((a,g)=>a+g.items.length,0)}</b>products</div><div><b>${MAN[MAN.length-1].items.length}</b>systems</div><div><b>${tot}</b>files · ${mb(bytes)}</div>`;
const list=$('#list'),idx=$('#idx');
MAN.forEach((g,gi)=>{const id='g'+gi;const a=document.createElement('a');a.href='#'+id;a.textContent=g.label==='Systems'?'Systems':g.label.replace('Category ','Cat ')+' · '+g.title;idx.append(a);
 const s=document.createElement('section');s.id=id;
 const h=document.createElement('div');h.className='sec-head';h.innerHTML=`<h2><small>${g.label}</small>${g.title}</h2>`;
 const b=document.createElement('button');b.className='btn';b.textContent='Download '+(g.label==='Systems'?'all systems':'category')+' (.zip)';
 b.onclick=()=>zipSet('OMIX_'+g.folder.replace(/[^A-Za-z0-9]+/g,'_')+'.zip',g.items.flatMap(it=>it.files.map(f=>[it.folder+'/'+f.sub+'/'+f.n,f])),b);h.append(b);s.append(h);
 const rows=document.createElement('div');rows.className='rows';
 g.items.forEach(it=>{const r=document.createElement('div');r.className='row';r.dataset.k=(it.name+' '+g.title).toLowerCase();
  const n=document.createElement('div');n.className='pname';n.textContent=it.name;const c=document.createElement('div');c.className='chips';
  it.files.slice().sort((x,y)=>ORDER[x.k]-ORDER[y.k]||x.n.localeCompare(y.n)).forEach(f=>{const k=document.createElement('button');k.className='chip';k.title=f.n;
   k.innerHTML=`${f.k}${f.n.endsWith('.jpg')?'':' PDF'}<span>${mb(f.s)}</span>`;k.onclick=async()=>{st.textContent='Fetching '+f.n+' …';try{if(await save(f.n,await fetchBlob(f.p)))k.classList.add('done')}catch(e){st.textContent='Could not load '+f.n}};c.append(k)});
  const zb=document.createElement('button');zb.className='chip';zb.textContent='All (.zip)';zb.onclick=()=>zipSet('OMIX_'+it.name.replace(/[^A-Za-z0-9]+/g,'_')+'.zip',it.files.map(f=>[f.sub+'/'+f.n,f]),zb);c.append(zb);
  r.append(n,c);rows.append(r)});
 s.append(rows);list.append(s)});
$('#all').onclick=e=>zipSet('OMIX_Document_Library.zip',MAN.flatMap(g=>g.items.flatMap(it=>it.files.map(f=>[(g.label==='Systems'?'Solutions':'Data sheet/'+g.folder)+'/'+it.folder+'/'+f.sub+'/'+f.n,f]))),e.currentTarget);
$('#q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.row').forEach(r=>r.hidden=q&&!r.dataset.k.includes(q));document.querySelectorAll('section').forEach(s=>s.hidden=q&&![...s.querySelectorAll('.row')].some(r=>!r.hidden))});
</script>
